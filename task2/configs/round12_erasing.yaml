# 第十二轮：轻度随机遮挡（报告第 6 节，E16）
# 同一 ConvNeXt-Tiny 配方，加 p=0.25、面积 2%–12%、宽高比 0.5–2 的随机遮挡。
# 单模型 71.03%，三成员融合 72.6124%；三折 OOF 由 67.4677% 升至 68.0851%
# （+0.617 个百分点，配对 bootstrap 95% 区间 [0.192, 1.032]）。
exp:
  name: r12_erasing
  seed: 20261011
  notes: "convnext + random erasing p0.25 area2-12% ratio0.5-2"

data:
  root: fer_data/fer_data
  img_size: 160
  val_size: 2848
  holdout_size: 0
  grayscale_to_rgb: true

aug:
  strength: 1.0
  erasing:
    enabled: true
    prob: 0.25
    area: [0.02, 0.12]
    ratio: [0.5, 2.0]

model:
  name: convnext_tiny
  pretrained: true
  dropout: 0.1
  head_lr_mult: 10.0
  in_ch: 3

train:
  epochs: 28
  batch_size: 48
  lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.04
  mixup_prob: 0.35
  amp: true
  refit_epochs: 8
