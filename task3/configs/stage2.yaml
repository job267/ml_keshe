# ============================================================================
# 阶段二：以 stage1 的粗坐标为中心裁切高清 patch -> 中心凹精坐标
# 训练: python -m src.train --config configs/stage2.yaml --stage 2 --fold all \
#            --s1-ckpt "outputs/runs/s1_fold{fold}/best.pt"
#
# 说明：本配置是按 v2 阶段一（resnet50+色彩增强，误差约 16px）重新推算的，
# 但**尚未跑完整验证**——旧版 stage1 误差约 54px，对应的 σ/patch 都大得多，
# 直接沿用会让裁切框抖动量是真实误差的 10 倍，训练/推理分布不一致。
# ============================================================================
task: stage2
seed: 42

data:
  root: detection
  gt_csv: detection/fovea_localization_train_GT.csv
  sample_submission: detection/sample_submission.csv
  img_size: [768, 512]        # stage2 不使用（保留以保持配置同构）
  n_folds: 5
  fold: 0
  num_workers: 4
  cache_mb: 400
  decode_scale: 2

aug:                          # 与阶段一一致：色彩重扰动、亮度温和扰动
  hflip: 0.5
  rotate: 8.0
  scale: [0.92, 1.08]
  translate: 0.03
  brightness: 0.15
  contrast: 0.15
  gamma: [0.8, 1.25]
  hue: 0.03
  saturation: [0.7, 1.3]
  channel_gain: 0.10
  illumination_p: 0.25
  clahe_p: 0.20
  blur_p: 0.15
  noise_p: 0.15

model:
  arch: fpn
  backbone: resnet50
  pretrained: true
  out_stride: 4               # patch 384 -> 热力图 96x96
  hidden: 128
  use_coord_head: true
  use_vis_head: false
  coord_source: soft
  dropout: 0.0

train:
  epochs: 80
  batch_size: 8
  lr: 1.0e-4                  # 只在中心附近微调，学习率要小（2e-4 会破坏"贴住裁切中心"的初值）
  backbone_lr_scale: 0.3
  weight_decay: 1.0e-4
  warmup_epochs: 8
  amp: true
  grad_clip: 1.0
  ema_decay: 0.99
  patience: 40
  eval_tta: true
  save_raw: false
  save_last_every: 10
  limit_batches: 0

loss:
  heatmap: mse
  w_heatmap: 1.0
  w_soft: 1.0
  w_coord: 0.5
  w_vis: 1.0
  coord: smoothl1
  smoothl1_beta: 0.01
  wing_w: 0.05
  wing_e: 0.1

heatmap:
  sigma: 2.0
  beta: 1.0

stage2:
  patch_size: 0.20            # 阶段一误差 ~16px / 2992 ≈ 0.005，框取 4σ 且保留黄斑上下文
  patch_resize: 384
  jitter_sigma: 0.015         # ≈ 3 倍阶段一误差，模拟真实裁切中心偏差
  big_jitter_prob: 0.2
  big_jitter_sigma: 0.04
  s1_ckpt: null               # 由 --s1-ckpt 传入（支持 {fold} 模板）

output:
  dir: outputs
