# ============================================================================
# v4 第 1+2 步：阶段二补全局上下文（6 通道输入）+ 加长调度
#
#   python -m src.train --config configs/stage2.yaml configs/v4/stage2_context.yaml `
#          --stage 2 --fold all --s1-ckpt "outputs/runs/s1_fold{fold}/best.pt"
#
# 动机：patch 只有 0.20 视野，视盘经常不在框内，而"中心凹相对视盘的位置"是最强先验。
#      fold4 上阶段二退化成"直接输出裁切中心"（=阶段一），就是局部信息不足的证据。
#
# 实现：输入从 3 通道变 6 通道 = [patch RGB, 整图缩略图 RGB(384x384)]。
#      * 数据集侧：`stage2.use_context=true` 时 FoveaDataset 自动拼上缩略图，
#        且 patch 与缩略图共用同一套光度增强参数（颜色风格一致）；
#      * 模型侧：train.py 自动把 `model.in_ch` 置 6，并把预训练 conv1 的权重
#        按 3 通道分组复制（每组 /2），保证每个视图的响应量级与单图输入一致。
#      * 推理侧：无需额外改动，检查点里已记录 in_ch=6。
# ============================================================================
train:
  epochs: 150               # v3 阶段二有 2 折到第 70 轮之后才见顶，调度要拉长
  patience: 60

stage2:
  use_context: true
