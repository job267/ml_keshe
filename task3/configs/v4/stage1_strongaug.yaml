# ============================================================================
# v4 第 3 步：更强的色彩增强（等前两步结果出来再开）
#
#   python -m src.train --config configs/stage1.yaml configs/v4/stage1_strongaug.yaml `
#          --stage 1 --fold all
#
# 已在 v3 证明"色彩增强 = 最大单项增益"（fold0 53.6 → 27.1 px），这里继续加码：
#   * 色相/饱和度/通道增益幅度约翻倍
#   * 新增 Lab 统计量抖动（整图色彩风格迁移，比 HSV 更接近"换一台相机"）
#   * 新增随机灰度 / 通道丢弃 / 通道打乱（彻底打断颜色-位置的相关性）
#   * 亮度相关（brightness/contrast/gamma）**保持不变**，避免破坏中心凹的亮度证据
# ============================================================================
train:
  epochs: 120               # 强增强需要更长调度才能收敛
  patience: 60

aug:
  hue: 0.05                 # ±5% 整圈（原 0.03）
  saturation: [0.6, 1.4]    # 原 [0.7, 1.3]
  channel_gain: 0.15        # 原 0.10
  illumination_p: 0.35      # 原 0.25
  clahe_p: 0.30             # 原 0.20
  lab_shift: 2.5            # 新增：Lab 均值平移（L 最多 ±2.5，a/b 最多 ±20）
  lab_scale: [0.85, 1.15]   # 新增：Lab 标准差缩放
  gray_p: 0.08              # 新增：随机灰度
  channel_dropout_p: 0.03   # 新增：随机丢一个通道
  channel_shuffle_p: 0.03   # 新增：随机打乱通道顺序
