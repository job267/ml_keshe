# ============================================================================
# v4 第 1 步（可选）：只把阶段一的 cosine 调度加长
#
#   python -m src.train --config configs/stage1.yaml configs/v4/stage1_epochs.yaml `
#          --stage 1 --fold all
#
# 依据：v3 的 5 折里，各折最好成绩出现在第 20~59 轮不等，fold1 到最后一轮还在刷新；
#      而 fold0/2/3 在第 20~28 轮见顶后验证反升（过拟合）。
#      加长调度能让 low-LR 阶段更充分；若过拟合回潮，配合 v4 的强增强一起用。
# ============================================================================
train:
  epochs: 120
  patience: 60              # 调度变长后早停也要放宽，否则还没进入低 LR 阶段就停了
